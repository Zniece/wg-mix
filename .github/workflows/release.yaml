name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build BPF objects
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          make -C ebpf bpf

      - name: Build release archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in amd64 arm64 armv7; do
            case "$target" in
              amd64) arch=amd64; goarm="" ;;
              arm64) arch=arm64; goarm="" ;;
              armv7) arch=arm; goarm=7 ;;
            esac
            out="build/$target"
            mkdir -p "$out"
            envs=(CGO_ENABLED=0 GOOS=linux GOARCH="$arch")
            [ -z "$goarm" ] || envs+=(GOARM="$goarm")
            env "${envs[@]}" go build -trimpath -ldflags '-s -w' -o "$out/wgmix" .
            (cd ebpf && env "${envs[@]}" go build -trimpath -ldflags '-s -w' -o "../$out/wgmix-ebpf" ./cmd/wg-mix-ebpf)
            cp wg-quick "$out/"
            tar -C "$out" -czf "dist/wg-mix-${version}-linux-${target}.tar.gz" .
          done
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: wg-mix ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
